# Apache 2.4 / JBCS, installed under /opt/opentelemetry-webserver-sdk.
# Change the collector endpoint and the three service identity values.
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_common.so
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_resources.so
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_trace.so
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_otlp_recordable.so
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_exporter_ostream_span.so
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_exporter_otlp_grpc.so
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_webserver_sdk.so
LoadModule otel_apache_module /opt/opentelemetry-webserver-sdk/WebServerModule/Apache/libmod_apache_otel.so

ApacheModuleEnabled ON
ApacheModuleServiceName jbcs-apache
ApacheModuleServiceNamespace webservers
ApacheModuleServiceInstanceId jbcs-node-01

ApacheModuleOtelSpanExporter otlp
ApacheModuleOtelExporterEndpoint localhost:4317
#ApacheModuleOtelExporterHeaders api-key=replace-me,tenant=replace-me
ApacheModuleOtelSslEnabled OFF
# For a TLS-enabled collector, switch SSL ON and set a PEM CA bundle:
#ApacheModuleOtelSslCertificatePath /etc/pki/tls/certs/ca-bundle.crt
ApacheModuleOtelSpanProcessor batch
ApacheModuleOtelSampler always_on
# W3C traceparent/tracestate only. Alternatives: b3 or w3c,b3.
ApacheModuleOtelPropagatorType w3c
ApacheModuleOtelPropagatorExtract ON
ApacheModuleOtelPropagatorInject ON

# These match SDK defaults; this version accepts but does not apply overrides.
ApacheModuleOtelMaxQueueSize 2048
ApacheModuleOtelScheduledDelayMillis 5000
ApacheModuleOtelExportTimeoutMillis 30000
ApacheModuleOtelMaxExportBatchSize 512

ApacheModuleResolveBackends ON
ApacheModuleReportAllInstrumentedModules ON
ApacheModuleTraceAsError ON
ApacheModuleCaptureRequestHeaders ON
ApacheModuleCaptureResponseHeaders ON
ApacheModuleCaptureQueryParameters ON

# Authorization -> http.request.headers.authorization (raw value).
# Other request headers remain in http.request.headers JSON.
ApacheModuleSeparateRequestHeaders Authorization
# All response headers remain in http.response.headers JSON.
ApacheModuleSeparateResponseHeaders ""

# Only these exact paths and subpath prefixes are traced.
ApacheModuleTraceRoutes /services,/auth,/checkSeamless

# Root span name is automatically METHOD /full/path (without the query).
# Status, URL, route, and available upstream attributes are automatic.

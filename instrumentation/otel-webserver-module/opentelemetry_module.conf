# Apache 2.4 / JBCS, installed under /opt/opentelemetry-webserver-sdk.
# Change the collector endpoint and the three service identity values.
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_common.so
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_resources.so
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_trace.so
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_otlp_recordable.so
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_exporter_ostream_span.so
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_exporter_otlp_grpc.so
LoadFile /opt/opentelemetry-webserver-sdk/sdk_lib/lib/libopentelemetry_webserver_sdk.so
LoadModule otel_apache_module /opt/opentelemetry-webserver-sdk/WebServerModule/Apache/libmod_apache_otel.so

ApacheModuleEnabled ON
ApacheModuleServiceName example-apache
ApacheModuleServiceNamespace example
ApacheModuleServiceInstanceId example-instance

ApacheModuleOtelSpanExporter otlp
ApacheModuleOtelExporterEndpoint localhost:4317
#ApacheModuleOtelExporterHeaders api-key=replace-me,tenant=replace-me
ApacheModuleOtelSslEnabled OFF
# For a TLS-enabled collector, switch SSL ON and set a PEM CA bundle:
#ApacheModuleOtelSslCertificatePath /etc/pki/tls/certs/ca-bundle.crt
ApacheModuleOtelSpanProcessor batch
ApacheModuleOtelSampler always_on
# W3C traceparent/tracestate only. Alternatives: b3 or w3c,b3.
ApacheModuleOtelPropagatorType w3c
# Independently accept an incoming parent and inject the current context.
# Extract OFF reuses a valid incoming trace ID as an Apache root with no parent.
# With absent/invalid context, generate a trace ID normally.
# Inject OFF preserves incoming headers;
# Apache may still forward them to a proxy backend (it does not strip them).
# Keep the valid incoming trace ID but create a new Apache root span.
# Incoming parent ID, sampling flags and vendor tracestate are not adopted.
ApacheModuleOtelPropagatorExtract OFF
# Replace incoming W3C/B3 headers with Apache's own context. Stale tracestate
# and alternate propagation formats are removed; application headers remain.
ApacheModuleOtelPropagatorInject ON

# These match SDK defaults; this version accepts but does not apply overrides.
ApacheModuleOtelMaxQueueSize 2048
ApacheModuleOtelScheduledDelayMillis 5000
ApacheModuleOtelExportTimeoutMillis 30000
ApacheModuleOtelMaxExportBatchSize 512

ApacheModuleResolveBackends ON
ApacheModuleReportAllInstrumentedModules ON
ApacheModuleTraceAsError ON
# The Apache error log records the final HTTP(S) proxy egress trace context
# and reports any traceparent restored after an earlier hook changed it.
ApacheModuleCaptureRequestHeaders ON
ApacheModuleCaptureResponseHeaders ON
ApacheModuleCaptureQueryParameters ON

# Authorization -> http.request.header.authorization (plain string for a single value).
# Other request headers remain in http.request.headers JSON.
# Only listed headers get individual header attributes; no legacy auto-split.
ApacheModuleSeparateRequestHeaders Authorization
# All response headers remain in http.response.headers JSON.
ApacheModuleSeparateResponseHeaders ""

# All routes are traced when this directive is omitted (as in this sample).
# Optional scope: uncomment and replace this generic example path.
# All descendants are included; trailing slashes are accepted.
#ApacheModuleTraceRoutes /api

# HTTP span names use configured routing targets, e.g. GET /api/{path}.
# Static ProxyPass/Location/ProxyPassMatch rules are recognized automatically.
# Unmatched/dynamic routes fall back to the method; raw paths stay in attributes.
# Optional literal labels for complex rewrites, placed in the matching Location:
#ApacheModuleServerSpanTarget /api/{path}
#ApacheModuleClientSpanTarget backend.example/{path}
# Set either directive to "" to force method-only names in that scope.
# SERVER: incoming request and Apache response; custom header capture stays here.
# CLIENT: the actual HTTP(S) mod_proxy handler, with backend server.address,
# server.port, url.full and actual http.response.status_code when received.
# Other module/stage spans are INTERNAL. No http.upstream.* aliases are emitted.
# Exactly one response x-trace-id matches the SERVER trace ID, even with injection OFF.
# url.query is a raw query string; known URL secrets are redacted in telemetry.
# A configured Host override supplies the logical hostname for IP proxy targets.
# Automatic CLIENT names use that hostname plus the configured path template.
# Ports remain in server.port/url.full, rather than the automatic span name.
# Client network.peer.address/port record the actual connection when available.
# In your separate proxy config, match trailing slashes on both sides:
# ProxyPass /api/ https://backend.example/
# This strips /api/ and preserves the remaining path without adding //.
# For a server/vhost rewrite whose capture includes the leading slash:
# RewriteRule ^/api(/.*)$ https://backend.example$1 [P,L]
